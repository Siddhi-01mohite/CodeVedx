<!DOCTYPE html>
<html>
<head>
    <title>AI Fake News Detection Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>📰 AI Based Fake News Detection Tool</h1>

    <form  method="POST">

        <textarea
            name="news"
            placeholder="Paste News Content Here..."
            required>
        </textarea>

        <button type="submit">
            Detect News
        </button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>Prediction: {{ prediction }}</h2>

        <h3>Confidence Score: {{ confidence }}%</h3>

    </div>

    {% endif %}

</div>

</body>
</html>
